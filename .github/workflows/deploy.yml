name: Build et déploiement o2switch
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:data
      - run: npm run build
      - name: Envoi vers o2switch (rsync SSH)
        env:
          SSH_KEY: ${{ secrets.O2_SSH_KEY }}
          HOST: ${{ secrets.O2_HOST }}
          USER: ${{ secrets.O2_USER }}
          DEST: ${{ secrets.O2_PATH }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          rsync -az --delete --exclude 'api/config.php' --exclude '.well-known' dist/ "$USER@$HOST:$DEST/"
